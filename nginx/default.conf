server {
    listen 80;
    server_name api.stickerbridge.app;

    # Renovación de certificados de Let's Encrypt.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name api.stickerbridge.app;

    ssl_certificate /etc/letsencrypt/live/api.stickerbridge.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.stickerbridge.app/privkey.pem;

    # La app sólo manda el link; las respuestas grandes son las del pack para
    # WhatsApp (stickers en base64, hasta ~20 MB en packs animados).
    client_max_body_size 1m;
    proxy_read_timeout 120;

    location / {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
